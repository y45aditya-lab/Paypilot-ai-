name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paypilot-ai/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paypilot-ai/server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paypilot-ai/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paypilot-ai/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration and build deployable images
        env:
          MONGO_USER: paypilot_ci
          MONGO_PASSWORD: paypilot_ci_password
          JWT_SECRET: ci-only-secret-not-used-for-production-0123456789
          CLIENT_ORIGIN: http://localhost:8080
        run: |
          docker compose -f paypilot-ai/docker-compose.yml config --quiet
          docker compose -f paypilot-ai/docker-compose.yml build
